name: Real model embedding smoke test

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  MDEXPLORER_RUN_REAL_MODEL_TESTS: "1"

jobs:
  real-model-embedding:
    name: Download from model hubs and run real ONNX inference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Configure model directory
        run: echo "MDEXPLORER_MODELS=$RUNNER_TEMP/mdexplorer-real-models" >> "$GITHUB_ENV"
      - name: Try Hugging Face, hf-mirror, then ModelScope
        run: scripts/fetch-real-models-with-fallback.sh --dir "$MDEXPLORER_MODELS"
      - name: Verify the selected model files
        run: scripts/fetch-ai-models.sh --dir "$MDEXPLORER_MODELS" --verify
      - name: Run real-weight CPU inference and semantic ranking tests
        run: dotnet test tests/MdExplorer.Tests -c Release --filter FullyQualifiedName~RealModelEmbeddingTests
