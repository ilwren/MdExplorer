name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # ci-artifacts 分支回传截图与测试日志

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test-ubuntu:
    name: Build + Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Validate local AI model downloader (offline)
        run: |
          bash -n scripts/fetch-ai-models.sh
          bash -n scripts/test-fetch-ai-models.sh
          scripts/test-fetch-ai-models.sh
          scripts/fetch-ai-models.sh --list
          scripts/fetch-ai-models.sh --dir "$RUNNER_TEMP/mdexplorer-ai-dry-run" --dry-run
          scripts/fetch-ai-models.sh --dir "$RUNNER_TEMP/mdexplorer-ai-dry-run" --all --dry-run
          scripts/fetch-ai-models.sh --dir "$RUNNER_TEMP/mdexplorer-ai-dry-run" --only audio-asr-tiny --dry-run
          scripts/fetch-ai-models.sh --dir "$RUNNER_TEMP/mdexplorer-ai-dry-run" --only audio-classify-yamnet --dry-run
          scripts/fetch-ai-models.sh --dir "$RUNNER_TEMP/mdexplorer-ai-dry-run" --only image-vlm-smol --dry-run
      - name: Restore
        run: dotnet restore MdExplorer.slnx
      - name: Build
        run: |
          set -o pipefail
          # 构建失败时 Actions 日志在沙箱里取不到，落盘一份随 ci-artifacts 回传。
          dotnet build MdExplorer.slnx -c Release --no-restore 2>&1 | tee build-output.txt
      - name: Unit tests
        run: |
          set -o pipefail
          dotnet test tests/MdExplorer.Tests -c Release --no-build 2>&1 | tee test-output.txt
      - name: Publish test log (回传 ci-artifacts 分支)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publish-artifacts.sh logs build-output.txt test-output.txt

  ui-screenshots:
    name: UI screenshots (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install CJK fonts (截图中文字形)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Render breakpoint screenshots
        run: |
          set -o pipefail
          # 57 个真实窗口长期共用一个无头 Skia 进程时，第三方文档控件的异步排版会让
          # 原生渲染资源累积并偶发 exit 139。按发现清单轮转拆成四个独立进程，仍覆盖全部用例。
          dotnet build tests/MdExplorer.Screenshots -c Release 2>&1 | tee screenshot-output.txt
          mapfile -t screenshot_tests < <(
            dotnet test tests/MdExplorer.Screenshots -c Release --no-build --list-tests 2>/dev/null \
              | grep -o 'MdExplorer\.Screenshots\.ScreenshotTests\.[A-Za-z0-9_]*' \
              | sort -u
          )
          if [ "${#screenshot_tests[@]}" -eq 0 ]; then
            echo "No screenshot tests were discovered." | tee -a screenshot-output.txt
            exit 1
          fi
          echo "Discovered ${#screenshot_tests[@]} screenshot tests; running in 4 isolated processes." | tee -a screenshot-output.txt
          for partition in 0 1 2 3; do
            filter=""
            count=0
            for index in "${!screenshot_tests[@]}"; do
              if [ $((index % 4)) -eq "$partition" ]; then
                filter="${filter:+$filter|}FullyQualifiedName=${screenshot_tests[$index]}"
                count=$((count + 1))
              fi
            done
            echo "=== Screenshot partition $((partition + 1))/4: $count tests ===" | tee -a screenshot-output.txt
            dotnet test tests/MdExplorer.Screenshots -c Release --no-build \
              --filter "$filter" --blame-crash --results-directory "$PWD/TestResults" \
              2>&1 | tee -a screenshot-output.txt
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/MdExplorer.Screenshots/bin/Release/**/screenshots/*.png
          if-no-files-found: warn
      - name: Publish screenshots (回传 ci-artifacts 分支)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/publish-artifacts.sh screenshots tests/MdExplorer.Screenshots/bin/Release/net10.0/screenshots/*.png
          seq="$(find TestResults -name 'Sequence_*.xml' -print -quit 2>/dev/null || true)"
          if [ -n "$seq" ]; then cp "$seq" blame-sequence.xml; fi
          bash .github/publish-artifacts.sh screenshot-logs screenshot-output.txt blame-sequence.xml

  publish-desktop:
    name: Desktop publish (self-contained)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Validate local AI model downloader (offline, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-ai-models.ps1 -List
          ./scripts/fetch-ai-models.ps1 -Dir "$env:RUNNER_TEMP/mdexplorer-ai-dry-run" -DryRun
          ./scripts/fetch-ai-models.ps1 -Dir "$env:RUNNER_TEMP/mdexplorer-ai-dry-run" -All -DryRun
          ./scripts/fetch-ai-models.ps1 -Dir "$env:RUNNER_TEMP/mdexplorer-ai-dry-run" -Only audio-asr-tiny -DryRun
          ./scripts/fetch-ai-models.ps1 -Dir "$env:RUNNER_TEMP/mdexplorer-ai-dry-run" -Only audio-classify-yamnet -DryRun
          ./scripts/fetch-ai-models.ps1 -Dir "$env:RUNNER_TEMP/mdexplorer-ai-dry-run" -Only image-vlm-smol -DryRun
      - name: Unit tests (windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/MdExplorer.Tests -c Release 2>&1 | tee test-output-win.txt
      - name: Publish test log (回传 ci-artifacts 分支)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publish-artifacts.sh logs-win test-output-win.txt
      - name: Publish self-contained
        run: dotnet publish src/MdExplorer.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/${{ matrix.rid }}
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: mdexplorer-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  publish-aot-linux:
    name: Desktop publish (Native AOT, linux-x64)
    runs-on: ubuntu-latest
    continue-on-error: true # v0.1 阶段为探路 Job；转绿后改为门禁（见 DEVELOPMENT.md §11.5）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish Native AOT
        run: dotnet publish src/MdExplorer.Desktop -c Release -r linux-x64 -p:PublishAot=true -o artifacts/linux-x64-aot
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: mdexplorer-linux-x64-aot
          path: artifacts/linux-x64-aot

  android:
    name: Android APK (debug-signed)
    runs-on: ubuntu-latest
    continue-on-error: true # v0.1 阶段为探路 Job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Android workload
        run: dotnet workload install android
      - name: Publish APK
        run: |
          set -o pipefail
          # 与 ubuntu 构建同理：Actions 日志在沙箱里取不到，落盘一份随 ci-artifacts 回传。
          dotnet publish src/MdExplorer.Android -c Release \
            -p:PublishTrimmed=true -p:RunAOTCompilation=true \
            -o artifacts/android 2>&1 | tee android-output.txt
      - name: Verify ONNX Runtime assets inside Android APK
        run: |
          apk="$(find artifacts/android -name '*.apk' -print -quit)"
          test -n "$apk"
          python3 scripts/verify-android-onnx-apk.py "$apk"
      - name: Publish android log (回传 ci-artifacts 分支)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publish-artifacts.sh logs-android android-output.txt
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdexplorer-android
          path: artifacts/android/*.apk
          if-no-files-found: warn
