name: native-ci

on:
  push:
    branches: ["arena/6cf6015e-mdexplorer"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json

      - name: Restore
        id: restore
        run: dotnet restore native/MdExplorer.slnx

      - name: Probe nuget versions (on restore failure)
        if: failure() && steps.restore.outcome == 'failure'
        run: |
          for pkg in sqlitepclraw.lib.e_sqlite3 sqlitepclraw.bundle_e_sqlite3 microsoft.data.sqlite; do
            echo "::error::versions of ${pkg}: $(curl -s "https://api.nuget.org/v3-flatcontainer/${pkg}/index.json" | tr -d '[]{}"' | tr ',' ' ' | tail -c 600)"
          done

      - name: Build
        id: build
        run: |
          set -eo pipefail
          dotnet build native/MdExplorer.slnx -c Release --no-restore 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | tee build.log

      - name: Report tail 1/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          tail -n 30 build.log | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report tail 2/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          tail -n 30 build.log | sed -n '11,20p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report tail 3/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          tail -n 30 build.log | sed -n '21,30p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report error lines 1/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E ": error " build.log | sort -u | sed -n '1,10p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report error lines 2/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E ": error " build.log | sort -u | sed -n '11,20p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report error lines 3/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E ": error " build.log | sort -u | sed -n '21,40p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Test
        run: |
          dotnet test native/tests/MdExplorer.Domain.Tests/MdExplorer.Domain.Tests.csproj -c Release --no-build
          dotnet test native/tests/MdExplorer.Application.Tests/MdExplorer.Application.Tests.csproj -c Release --no-build
          dotnet test native/tests/MdExplorer.ArchitectureChecks/MdExplorer.ArchitectureChecks.csproj -c Release --no-build

  aot-publish-linux:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json

      - name: Install Native AOT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish (linux-x64, PublishAot)
        run: dotnet publish native/src/MdExplorer.Desktop/MdExplorer.Desktop.csproj -c Release -r linux-x64

      - name: Smoke-run binary
        run: |
          BIN=$(find native/src/MdExplorer.Desktop/bin/Release -type f -name MdExplorer | head -1)
          echo "published: $BIN"
          file "$BIN" || true
          ldd "$BIN" | head -20 || true

  aot-publish-windows:
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json

      - name: Publish (win-x64, PublishAot)
        run: dotnet publish native/src/MdExplorer.Desktop/MdExplorer.Desktop.csproj -c Release -r win-x64
