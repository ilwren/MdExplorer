name: native-ci

on:
  push:
    branches: ["arena/6cf6015e-mdexplorer"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json

      - name: Restore
        run: dotnet restore native/MdExplorer.slnx

      - name: Build
        id: build
        run: |
          set -eo pipefail
          dotnet build native/MdExplorer.slnx -c Release --no-restore 2>&1 | tee build.log || { echo "build_failed=true" >> "$GITHUB_OUTPUT"; exit 1; }

      - name: Report errors (part 1)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "error (CS|NU|MSB)" build.log | sort -u | sed -n '1,8p' | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Report errors (part 2)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "error (CS|NU|MSB)" build.log | sort -u | sed -n '9,16p' | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Report errors (part 3)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E "error (CS|NU|MSB)" build.log | sort -u | sed -n '17,40p' | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Test
        run: |
          dotnet test native/tests/MdExplorer.Domain.Tests/MdExplorer.Domain.Tests.csproj -c Release --no-build
          dotnet test native/tests/MdExplorer.Application.Tests/MdExplorer.Application.Tests.csproj -c Release --no-build
