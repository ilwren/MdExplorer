name: native-ci

on:
  push:
    branches: ["arena/6cf6015e-mdexplorer"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json

      - name: Restore
        id: restore
        run: dotnet restore native/MdExplorer.slnx

      - name: Probe nuget versions (on restore failure)
        if: failure() && steps.restore.outcome == 'failure'
        run: |
          for pkg in sqlitepclraw.lib.e_sqlite3 sqlitepclraw.bundle_e_sqlite3 microsoft.data.sqlite; do
            echo "::error::versions of ${pkg}: $(curl -s "https://api.nuget.org/v3-flatcontainer/${pkg}/index.json" | tr -d '[]{}"' | tr ',' ' ' | tail -c 600)"
          done

      - name: Build
        id: build
        run: |
          set -eo pipefail
          dotnet build native/MdExplorer.slnx -c Release --no-restore 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | tee build.log

      - name: Report tail 1/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          tail -n 30 build.log | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report tail 2/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          tail -n 30 build.log | sed -n '11,20p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report tail 3/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          tail -n 30 build.log | sed -n '21,30p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report error lines 1/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E ": error " build.log | sort -u | sed -n '1,10p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report error lines 2/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E ": error " build.log | sort -u | sed -n '11,20p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report error lines 3/3
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E ": error " build.log | sort -u | sed -n '21,40p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Test
        id: test
        run: |
          set -eo pipefail
          for proj in \
            native/tests/MdExplorer.Domain.Tests/MdExplorer.Domain.Tests.csproj \
            native/tests/MdExplorer.Application.Tests/MdExplorer.Application.Tests.csproj \
            native/tests/MdExplorer.ArchitectureChecks/MdExplorer.ArchitectureChecks.csproj; do
            echo "### $proj"
            dotnet test "$proj" -c Release --no-build 2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | tee -a test.log
          done

      - name: Report test failures 1/3
        if: failure() && steps.test.outcome == 'failure'
        run: grep -iE "failed|assert|错误|violat|违反|引用" test.log | sort -u | sed -n '1,10p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report test failures 2/3
        if: failure() && steps.test.outcome == 'failure'
        run: grep -iE "failed|assert|错误|violat|违反|引用" test.log | sort -u | sed -n '11,20p' | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Report test failures 3/3
        if: failure() && steps.test.outcome == 'failure'
        run: tail -n 25 test.log | while IFS= read -r line; do echo "::error::$line"; done || true

  aot-publish-linux:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json

      - name: Install Native AOT + headless display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev xvfb \
            libfontconfig1 libx11-6 libxrandr2 libxi6 libice6 libsm6 libgl1 libglx-mesa0

      - name: Publish (linux-x64, PublishAot)
        id: publish
        run: |
          set -eo pipefail
          dotnet publish native/src/MdExplorer.Desktop/MdExplorer.Desktop.csproj -c Release -r linux-x64 \
            2>&1 | sed -e 's/\x1b\[[0-9;]*m//g' | tee publish.log
          grep -cE "warning IL[0-9]+" publish.log > ilwarn.txt || echo 0 > ilwarn.txt
          echo "::notice::AOT/裁剪告警数：$(cat ilwarn.txt)"

      - name: Report publish errors
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          grep -E ": (error|错误) " publish.log | sort -u | sed -n '1,10p' \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          grep -iE "ILC|descriptor|descriptor file|LC0000" publish.log | sort -u | sed -n '1,6p' \
            | while IFS= read -r line; do echo "::error::ILC|$line"; done || true
          tail -n 15 publish.log | sed -n '1,10p' \
            | while IFS= read -r line; do echo "::error::tail|$line"; done || true

      - name: Summarize AOT warnings — by code
        if: always()
        run: |
          grep -oE "(warning|错误) IL[0-9]+" publish.log | sort | uniq -c | sort -rn | head -10 \
            | while IFS= read -r line; do echo "::notice::$line"; done || true

      - name: Summarize AOT warnings — own source files
        if: always()
        run: |
          grep -E "warning IL[0-9]+" publish.log | grep -oE "/src/[^:]+" | sed -E 's#^.*/native/src/##' | sort | uniq -c | sort -rn | head -10 \
            | while IFS= read -r line; do echo "::notice::自有源码|$line"; done || true

      - name: Summarize AOT warnings — external samples
        if: always()
        run: |
          grep -E "warning IL[0-9]+" publish.log | grep -vE "/src/" | sed -E 's#^.*/(packages|nuget)[^/]*/##' | cut -c1-150 | sort -u | head -10 \
            | while IFS= read -r line; do echo "::notice::外部包|$line"; done || true

      - name: Verify output really is Native AOT
        run: |
          set -eo pipefail
          PUB=native/src/MdExplorer.Desktop/bin/Release/net10.0/linux-x64/publish
          BIN="$PUB/MdExplorer"
          test -f "$BIN" || { echo "::error::未找到发布产物 $BIN"; ls -la "$PUB"; exit 1; }
          SIZE=$(stat -c%s "$BIN")
          echo "published: $BIN ($SIZE bytes)"
          file "$BIN"
          file "$BIN" | grep -q "ELF 64-bit" || { echo "::error::产物不是原生 ELF 可执行文件"; exit 1; }
          if ldd "$BIN" 2>&1 | grep -qiE "libcoreclr|libhostfxr|libhostpolicy"; then
            echo "::error::产物仍依赖 CoreCLR/hostfxr，说明不是 Native AOT"; ldd "$BIN"; exit 1
          fi
          if [ -f "$PUB/MdExplorer.dll" ]; then
            echo "::error::publish 目录仍含托管程序集 MdExplorer.dll，不是 Native AOT"; ls -la "$PUB"; exit 1
          fi
          echo "✅ Native AOT 产物校验通过（无 CoreCLR 依赖、无托管 dll）"
          du -sh "$PUB" || true
          ls -la "$PUB" | head -20

      - name: Runtime self-test inside the Native AOT binary
        id: selftest
        run: |
          set -eo pipefail
          BIN=native/src/MdExplorer.Desktop/bin/Release/net10.0/linux-x64/publish/MdExplorer
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" timeout 180 "$BIN" --selftest > app.log 2>&1
          CODE=$?
          set -e
          CLEAN=$(mktemp)
          sed -e 's/\x1b\[[0-9;]*m//g' app.log > "$CLEAN"
          cat "$CLEAN" | tail -40
          # 通过项以 notice 上报（annotations API 可在生成环境读取）
          grep -E "^\[selftest\] PASS" "$CLEAN" | cut -c1-90 | head -10 \
            | while IFS= read -r line; do echo "::notice::$line"; done || true
          if [ "$CODE" -eq 124 ]; then
            echo "::error::AOT 自检超时（180s），疑似死锁"
            sed -e 's/\x1b\[[0-9;]*m//g' app.log | tail -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if [ "$CODE" -ne 0 ]; then
            echo "::error::AOT 自检失败，退出码 $CODE"
            grep -E "^\[selftest\] (❌|FAIL|   - )" "$CLEAN" | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "^\[selftest\]" "$CLEAN" | tail -6 \
              | while IFS= read -r line; do echo "::error::tail|$line"; done
            exit 1
          fi
          echo "✅ Native AOT 运行时自检全部通过（DI / SQLite / JSON / XAML / 反射绑定）"

      - name: Stay-alive smoke (must survive 15s)
        run: |
          set -eo pipefail
          BIN=native/src/MdExplorer.Desktop/bin/Release/net10.0/linux-x64/publish/MdExplorer
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" timeout -k 5 15 "$BIN" > alive.log 2>&1
          CODE=$?
          set -e
          echo "app exit code: $CODE (124 = 被 timeout 终止，即存活满 15s)"
          sed -e 's/\x1b\[[0-9;]*m//g' alive.log | tail -20
          if [ "$CODE" -ne 124 ]; then
            echo "::error::Native AOT 产物运行失败，退出码 $CODE"
            sed -e 's/\x1b\[[0-9;]*m//g' alive.log | tail -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "✅ 应用在 Native AOT 下启动并稳定运行 15s 无崩溃"

  aot-publish-windows:
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json

      - name: Publish (win-x64, PublishAot)
        id: publish
        shell: pwsh
        run: |
          dotnet publish native/src/MdExplorer.Desktop/MdExplorer.Desktop.csproj -c Release -r win-x64 2>&1 |
            Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report publish errors
        if: failure() && steps.publish.outcome == 'failure'
        shell: pwsh
        run: |
          $lines = Get-Content publish.log | Where-Object { $_ -match ": (error|错误) " } | Select-Object -Unique
          $lines | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$_" }
          Get-Content publish.log -Tail 12 | ForEach-Object { Write-Host "::error::tail|$_" }

      - name: Verify output really is Native AOT
        shell: pwsh
        run: |
          $pub = "native/src/MdExplorer.Desktop/bin/Release/net10.0/win-x64/publish"
          $exe = Join-Path $pub "MdExplorer.exe"
          if (-not (Test-Path $exe)) { Write-Error "未找到发布产物 $exe"; Get-ChildItem $pub; exit 1 }
          $size = (Get-Item $exe).Length
          Write-Host "published: $exe ($size bytes)"
          if (Test-Path (Join-Path $pub "MdExplorer.dll")) { Write-Error "publish 目录仍含托管 dll，不是 Native AOT"; exit 1 }
          if ((Test-Path (Join-Path $pub "hostfxr.dll")) -or (Test-Path (Join-Path $pub "coreclr.dll"))) {
            Write-Error "publish 目录含 hostfxr/coreclr，不是 Native AOT"; exit 1
          }
          if ($size -lt 1MB) { Write-Error "可执行文件仅 $size 字节，疑似 apphost 而非 Native AOT 产物"; exit 1 }
          Write-Host "✅ Windows Native AOT 产物校验通过"
          Get-ChildItem $pub | Select-Object Name, Length | Format-Table -AutoSize
