<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Eidoria — 万象屿</title>
  <desc id="desc">极简拱门环抱金日与两层屿浪：入口、岛屿与被预览照亮的内容。</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073B4C"/>
      <stop offset="1" stop-color="#006A6A"/>
    </linearGradient>
    <clipPath id="innerArch">
      <path d="M326 790 L326 486 C326 356 410 252 512 252 C614 252 698 356 698 486 L698 790 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#field)"/>

  <!-- Coral registration echo: one quiet offset, no illustration clutter. -->
  <path d="M296 760 L296 470 C296 324 396 206 496 206 C596 206 696 324 696 470 L696 760"
        fill="none" stroke="#FF7A66" stroke-width="62" stroke-linecap="round" opacity="0.92"/>

  <!-- Island strata inside the arch. -->
  <g clip-path="url(#innerArch)">
    <path d="M306 660 C402 612 478 684 578 640 C640 613 688 620 720 642 L720 810 L306 810 Z" fill="#159E93"/>
    <path d="M306 718 C402 678 486 738 584 702 C644 680 692 686 720 704 L720 810 L306 810 Z" fill="#9FE8D2"/>
    <path d="M306 768 C410 738 492 786 592 754 C650 736 694 740 720 754 L720 810 L306 810 Z" fill="#FF7A66"/>
  </g>

  <!-- Sun: preview light / island sun. -->
  <circle cx="512" cy="438" r="88" fill="#FFC94D"/>

  <!-- Main arch: a single confident Material stroke. -->
  <path d="M318 784 L318 478 C318 330 408 222 512 222 C616 222 706 330 706 478 L706 784"
        fill="none" stroke="#FFF3D6" stroke-width="68" stroke-linecap="round"/>

  <!-- Ground line: the island sits on one calm baseline. -->
  <path d="M302 810 L722 810" stroke="#FFF3D6" stroke-width="30" stroke-linecap="round"/>
</svg>
