<!-- ───────────────── Studio bar (演示控制条，不属于应用) ───────────────── -->
<header class="studio">
  <div class="studio__brand">
    <img src="assets/eidoria-icon.svg" alt="" class="studio__logo">
    <div class="studio__brandtext"><strong>Eidoria</strong><span>万象屿 · 概念第一版</span></div>
  </div>

  <div class="studio__group" role="group" aria-label="断点">
    <span class="studio__label">断点</span>
    <div class="segmented" id="bpSwitch">
      <button data-bp="compact"      title="Compact 390×844">Compact</button>
      <button data-bp="medium"       title="Medium 768×1024">Medium</button>
      <button data-bp="expanded"     title="Expanded 1100×760">Expanded</button>
      <button data-bp="large"        title="Large 1440×900" class="is-active">Large</button>
      <button data-bp="xlarge"       title="ExtraLarge 1920×1080">XLarge</button>
    </div>
  </div>

  <div class="studio__group" role="group" aria-label="主题">
    <span class="studio__label">主题</span>
    <div class="segmented segmented--icon" id="themeSwitch">
      <button data-theme="light" title="浅色主题" class="is-active"><svg class="ico"><use href="#i-sun"/></svg></button>
      <button data-theme="dark" title="深色主题"><svg class="ico"><use href="#i-moon"/></svg></button>
    </div>
  </div>

  <div class="studio__group" role="group" aria-label="场景">
    <span class="studio__label">场景</span>
    <select class="scene-select" id="sceneSelect" title="切换概念图场景"></select>
  </div>

  <div class="studio__group studio__group--right" role="group" aria-label="选项">
    <label class="toggle" title="减少动态效果">
      <input type="checkbox" id="reduceMotion"><span class="toggle__track"><span class="toggle__thumb"></span></span>
      <svg class="ico"><use href="#i-bolt"/></svg><span class="toggle__text">减少动效</span>
    </label>
    <button class="studio__btn" id="helpBtn" title="快捷键与说明"><svg class="ico"><use href="#i-keyboard"/></svg></button>
  </div>
</header>

<!-- ───────────────── Stage ───────────────── -->
<main class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">
    <div class="app" id="app" data-bp="large" data-theme="light" data-view="grid" data-nav="图片">

      <!-- 窗口顶栏 / 标签条 -->
      <header class="titlebar">
        <div class="titlebar__brand">
          <img src="assets/eidoria-icon.svg" alt="" class="brand-mark">
          <span class="brand-name">Eidoria</span>
        </div>
        <button class="icon-btn compact-menu" id="hamburger" title="导航" aria-label="打开导航抽屉"><svg class="ico"><use href="#i-menu"/></svg></button>
        <span class="compact-title">Eidoria</span>
        <div class="tabstrip" id="tabstrip"></div>
        <button class="icon-btn compact-tabs" id="tabsBtn" title="标签页" aria-label="标签页"><svg class="ico"><use href="#i-tabs"/></svg><span class="badge" id="tabsBadge">3</span></button>
        <div class="window-controls" id="windowControls">
          <button class="win-btn" data-win="minimize" title="最小化" aria-label="最小化"><svg class="ico"><use href="#i-win-min"/></svg></button>
          <button class="win-btn" data-win="maximize" title="最大化 / 恢复" aria-label="最大化或恢复"><svg class="ico"><use href="#i-win-max"/></svg></button>
          <button class="win-btn win-btn--close" data-win="close" title="关闭" aria-label="关闭"><svg class="ico"><use href="#i-win-close"/></svg></button>
        </div>
      </header>

      <div class="shell" id="shell">
        <!-- 左导航 -->
        <aside class="drawer" id="drawer">
          <button class="new-btn" id="newBtn"><svg class="ico"><use href="#i-plus"/></svg><span>新建</span></button>
          <nav class="drawer__nav" id="drawerNav"></nav>
          <div class="drawer__storage">
            <div class="drawer__group-title" id="storageTitle">存储量</div>
            <div class="drawer__volumes" id="volumes"></div>
          </div>
          <div class="drawer__spacer"></div>
          <div class="drawer__footer" id="drawerFooter"></div>
        </aside>

        <!-- 主工作卡 -->
        <section class="browser" id="browser">
          <div class="browser__nav">
            <div class="navbuttons" id="navButtons"></div>
            <div class="crumbs" id="crumbs"></div>
            <div class="search-island" id="searchIsland" role="button" tabindex="0" title="搜索（Ctrl+F / Ctrl+K）">
              <svg class="ico"><use href="#i-search"/></svg><span class="search-island__text" id="islandText"></span>
            </div>
            <button class="icon-btn" id="overflowBtn" title="更多" aria-label="更多"><svg class="ico"><use href="#i-more"/></svg></button>
          </div>
          <div class="browser__toolbar" id="toolbar"></div>
          <div class="browser__content">
            <div class="view-head" id="viewHead"></div>
            <div class="file-view" id="fileView"></div>
            <div class="empty-state" id="emptyState" hidden></div>
          </div>
          <div class="browser__status" id="statusBar"></div>
        </section>

        <!-- 右侧预览侧栏 -->
        <aside class="preview" id="previewPane"></aside>
      </div>

      <!-- 规划场景覆盖层（概念图 06–15；概念设计评审稿，不代表功能已实现） -->
      <div class="scene-layer" id="sceneLayer" hidden></div>

      <!-- Compact 底部导航 -->
      <nav class="bottom-nav" id="bottomNav"></nav>

      <!-- 悬浮搜索面板 -->
      <div class="search-panel" id="searchPanel" hidden>
        <div class="search-panel__bar">
          <svg class="ico"><use href="#i-search"/></svg>
          <input id="searchInput" type="text" placeholder="搜索当前文件夹" autocomplete="off" spellcheck="false">
          <span class="search-panel__count" id="searchCount"></span>
          <button class="icon-btn" id="searchClose" title="关闭（Esc）"><svg class="ico"><use href="#i-close"/></svg></button>
        </div>
        <div class="search-panel__modes">
          <button class="chip is-active" data-mode="filter">当前文件夹</button>
          <button class="chip" data-mode="recursive">递归搜索</button>
          <span class="search-panel__hint">回车递归 · Esc 收起</span>
        </div>
        <div class="search-panel__results" id="searchResults"></div>
      </div>

      <!-- 悬浮预览窗（Compact / Medium） -->
      <div class="floating" id="floating" hidden></div>

      <!-- 任务中心 -->
      <div class="task-center" id="taskCenter" hidden></div>

      <!-- 通用菜单浮层 -->
      <div class="popover" id="popover" hidden></div>

      <!-- 对话框 -->
      <div class="dialog-backdrop" id="dialogBackdrop" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>

      <!-- Snackbar -->
      <div class="snackbar" id="snackbar" hidden></div>
    </div>

    <!-- 窗口状态占位：最小化 / 关闭 -->
    <div class="win-state" id="winState" hidden>
      <img src="assets/eidoria-icon.svg" alt="" class="win-state__logo">
      <div class="win-state__title" id="winStateTitle">Eidoria</div>
      <div class="win-state__desc" id="winStateDesc"></div>
      <button class="filled-btn" data-win="restore" id="winStateRestore">恢复窗口</button>
    </div>
  </div>
  <div class="stage-caption" id="stageCaption"></div>
</main>

<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
